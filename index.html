<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BogFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BogFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone app — cover page, then five pages behind a bottom tab bar. */
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --sunk:#E3E7E4; --line:#D3D9D5;
  --ink:#18201C; --muted:#5F6A64; --body:#8E979F; --outline:#FFFFFF; --accent:#2B47D1; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB;
  --zone:#2E8B57; --zone-soft:#D4EBDD; --over:#B86E00; --over-soft:#F6E6CC; --under:#B4372E;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A201D; --sunk:#232A26; --line:#2F3833;
  --ink:#E8EEEA; --muted:#97A39C; --body:#56606A; --outline:#1A201D; --accent:#7D93FF; --accent-ink:#0D1240; --accent-soft:#232B52;
  --zone:#5CC28A; --zone-soft:#1E3A2A; --over:#E7A64A; --over-soft:#3A2D17; --under:#F07B70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201D; --sunk:#232A26; --line:#2F3833;
  --ink:#E8EEEA; --muted:#97A39C; --body:#56606A; --outline:#1A201D; --accent:#7D93FF; --accent-ink:#0D1240; --accent-soft:#232B52;
  --zone:#5CC28A; --zone-soft:#1E3A2A; --over:#E7A64A; --over-soft:#3A2D17; --under:#F07B70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.chip .dot.zone{background:var(--zone)}.chip .dot.over{background:var(--over)}.chip .dot.under{background:var(--under)}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:15px;margin-top:4px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.last{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px}
.pill.up{background:var(--over-soft);color:var(--over)}.pill.hold{background:var(--zone-soft);color:var(--zone)}.pill.down{background:var(--accent-soft);color:var(--accent)}
.weight{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px;align-items:center}
.step{height:56px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:600;line-height:1}
.big{display:flex;align-items:baseline;justify-content:center;gap:6px;background:var(--sunk);border-radius:12px;padding:6px 10px;min-width:0}
.big input{width:100%;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums;padding:0;text-align:center}
.big input:focus{outline:none}
.big:focus-within{outline:2px solid var(--accent)}
.big span{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--muted);flex:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:17px;font-variant-numeric:tabular-nums}
.field small{color:var(--muted);font-size:13px}
.secs{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:end}
.bigtimer{height:72px;border:0;border-radius:14px;background:var(--zone);color:#fff;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.03em;text-transform:uppercase}
.secs .field input{text-align:center;font-weight:600;height:48px}
.timerbtns{display:flex;gap:8px}
.tbtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:600;font-size:17px;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.primary.alt{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.toast{font-size:14px;color:var(--zone);font-weight:600;min-height:1.2em;margin:-4px 0 0}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:8px;align-items:center}
.set-row input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:16px}
.set-row input.val{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;background:var(--sunk);border-radius:10px;color:var(--muted);font-size:20px;line-height:1}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}
.empty-note{color:var(--muted);font-size:15px;margin:0}
.hist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px}
.hcard{flex:none;width:118px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.hcard .d{font-size:13px;color:var(--muted)}
.hcard .w,.hcard .s{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.hcard .w small,.hcard .s small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:3px}
.hcard .s{border-top:1px solid var(--line);padding-top:3px;margin-top:3px}
.hcard .s.zone{color:var(--zone)}.hcard .s.over{color:var(--over)}.hcard .s.under{color:var(--under)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11.5px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;vertical-align:middle;margin-right:5px}
textarea{resize:vertical;min-height:80px}
.banner{background:var(--over-soft);color:var(--over);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.center{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.center h2{font-family:var(--f-display);font-size:28px;margin:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h2{font-family:var(--f-display);font-size:28px;margin:0}
.sheet .actions{display:flex;gap:10px;flex-wrap:wrap}
.sheet .actions > *{flex:1 1 120px}
.danger{border:1px solid var(--under);color:var(--under);background:transparent;border-radius:12px;padding:12px;font-weight:600}
.danger.solid{background:var(--under);color:var(--surface)}
.confirm{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* timer */
.timer{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.timer .mname{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.03em;opacity:.8;text-align:center}
.timer .phase{font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.7}
.timer .clock{font-family:var(--f-display);font-weight:700;font-size:min(42vw,200px,22vh);line-height:.9;font-variant-numeric:tabular-nums}
.tinfo{width:100%;max-width:420px;background:rgb(127 127 127/.16);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tinfo .tw{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tinfo .tw b{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.tinfo .tw b small{font-size:20px;opacity:.7;margin-left:4px}
.tinfo .tl{font-size:13px;opacity:.65;text-align:right;line-height:1.3}
.tinfo .tset{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;border-top:1px solid rgb(127 127 127/.3);padding-top:10px}
.tinfo .tset div{display:flex;flex-direction:column;min-width:0}
.tinfo .tset span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo .tset strong{font-family:var(--f-display);font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.tinfo .tnote{font-size:14px;opacity:.75;border-top:1px solid rgb(127 127 127/.3);padding-top:8px;white-space:pre-wrap}
.timer.red .clock,.timer.red .tline{color:var(--under)}.timer.green .clock,.timer.green .tline{color:var(--zone)}.tline .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);opacity:.7;z-index:1}
.tline{width:100%;max-width:420px;height:14px;border-radius:7px;background:rgb(127 127 127/.3);position:relative;overflow:hidden}
.tline .band{position:absolute;top:0;bottom:0;background:rgb(92 194 138/.35)}
.tline .fill{position:absolute;left:0;top:0;bottom:0;background:currentColor}
.tscale{width:100%;max-width:420px;position:relative;height:16px;font-size:12px;opacity:.6;margin-top:-14px}.tscale span{position:absolute;top:0;transform:translateX(-50%)}.tscale span:first-child{transform:none}.tscale span:last-child{transform:translateX(-100%)}
.timer .tact{display:flex;gap:12px;width:100%;max-width:420px}
.timer .tact button{flex:1;border-radius:14px;padding:16px;font-weight:700;font-size:18px;border:0}
.stop{background:var(--bg);color:var(--ink)}
.cancel{background:transparent!important;border:1px solid rgb(127 127 127/.5)!important;color:inherit}
.body-map{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body-map .base{fill:var(--body)}
.body-map .det{fill:var(--body);stroke:var(--outline);stroke-width:.45}
.body-map .mus{fill:var(--body);stroke:var(--outline);stroke-width:.55;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.body-map .mus.target{fill:var(--accent)}
.body-map .mus.picked{fill:var(--zone)}
.body-map g[data-muscle]:hover .mus:not(.picked){opacity:.8}
.body-map g[data-muscle]:focus{outline:none}
.body-map g[data-muscle]:focus-visible .mus{stroke:var(--ink);stroke-width:.9}
.body-map text{fill:var(--muted);font-family:var(--f-body);font-size:5.5px;letter-spacing:.08em;text-transform:uppercase}
.mname-big{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--zone);margin:0}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks .chip{font-size:14px;padding:7px 12px}
.picks .chip .tag{font-size:12px;color:var(--muted);font-weight:500}
.picks .chip[aria-current="true"] .tag{color:inherit;opacity:.7}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{padding-block:12px 8px}
.brandbtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:var(--ink)}
.logo{width:28px;height:28px;flex:none;color:var(--accent)}
.brandbtn .brand{font-weight:600;font-size:16px;letter-spacing:.16em;color:var(--muted)}
.pagetitle{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);letter-spacing:.03em;margin:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;width:100%;max-width:620px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* cover */
.cover{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:20px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px}
.hero .wm{display:flex;align-items:center;gap:12px}
.hero .wm{gap:14px}
.hero .wm .logo{width:60px;height:60px;color:var(--bg)}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1;letter-spacing:.18em;margin:0 0 4px;text-transform:uppercase;opacity:.5}
.hero .sub{opacity:.7;font-size:15px;margin:0}
.hero .ghostlogo{position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;color:var(--bg);opacity:.05;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgb(127 127 127/.14);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.75}
.go{border:0;border-radius:14px;background:var(--zone);color:#fff;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;padding:18px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles > .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{border:0;background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:22px;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.mini-map{pointer-events:none}
.mini-map .body-map{border:0;max-width:300px;background:transparent}
/* lists */
.sess{display:flex;flex-direction:column;gap:2px}
.sess h3{font-family:var(--f-display);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sess h3 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border:0;background:transparent;border-top:1px solid var(--line);padding:10px 0;text-align:left;width:100%}
.srow .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .v{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.srow .v small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
.srow.split button{border:0;background:transparent;padding:4px 0;font:inherit;color:inherit;text-align:left;min-width:0}
.srow.split .n{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.srow.split .vals{grid-column:span 2;display:flex;gap:12px;justify-content:flex-end;border-radius:8px}
.srow.split .vals:active,.srow.split .n:active{background:var(--sunk)}
.srow .v.zone{color:var(--zone)}.srow .v.over{color:var(--over)}.srow .v.under{color:var(--under)}
.segwide{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.segwide button{border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.segwide button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.mrow .n{font-weight:600}.mrow .meta{margin:0;font-size:13px}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line);padding:9px 0;font-size:15px}
.prog b{font-variant-numeric:tabular-nums}
.up{color:var(--zone);font-weight:600}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.works{font-size:15px;color:var(--muted);margin:0}
.works b{color:var(--ink)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:2px}
label.go{display:block;font-size:22px}
.mphoto{width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.actions-row{display:flex;gap:10px;flex-wrap:wrap}
.actions-row > *{flex:1 1 140px;text-align:center}
.photo-btn{cursor:pointer;padding:11px 12px}
.mrow-l{display:flex;gap:10px;align-items:center;min-width:0}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.htiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.htile{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.htile .hl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.htile b{font-family:var(--f-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}

<body>

<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="bar">
      <button class="brandbtn" data-go="home" aria-label="BogFit home"><span id="logoSlot"></span><span class="brand">BogFit</span></button>
      <p class="pagetitle" id="pagetitle"></p>
    </div>
    <nav class="strip" id="strip" aria-label="Machines" hidden></nav>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="center"><h2>Loading BogFit…</h2><p class="empty-note">Your machines, sessions and history appear here.</p></div>
  </main>
</div>
<nav class="tabs" id="tabs" aria-label="Pages" hidden><div class="in"></div></nav>
<div id="sheetRoot"></div>
<div id="timerRoot"></div>

<script>
(function(){
const KG = 0.45359237;
const S = {
  db:null, mode:'loading', machines:[], hist:{}, prefs:{unit:'kg',zoneMin:120,zoneMax:140,kgStep:7.5,lbStep:2,timerGreen:120,timerMax:180},
  profile:{name:'',bodyweight:'',height:'',gym:'BlueFit Lane Cove',goal:''},
  locked:!(window.claude && window.claude.use), health:null, healthBusy:false, healthMsg:'', page:'home', histView:'sessions', sel:null, muscle:null, drafts:{}, toast:'', sheet:null, timer:null
};
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const unit = () => S.prefs.unit==='lb'?'lb':'kg';
const uLabel = u => u==='lb'?'lbs':'kg';
const conv = (w,from,to) => from===to ? w : (from==='lb' ? w*KG : w/KG);
const r1 = n => Math.round(n*10)/10;
const fmt = n => { const v=Math.round(n*100)/100; return String(v); };
/* Weights follow each machine's increment (0.5, 1, 2, 2.5, 5 or 10 kg). */
const INC_KG=[0.5,1,2,2.5,5,10], INC_LB=[1,2,2.5,5,10,15];
const r2 = n => Math.round(n*100)/100;
const inUnit = e => { const from=e.unit||'kg', v=conv(Number(e.weight)||0, from, unit()); return from===unit() ? r2(v) : Math.round(v); };
const stepFor = m => { const v = unit()==='lb' ? (Number(m&&m.incLb)||Number(S.prefs.lbStep)||2) : (Number(m&&m.incKg)||Number(S.prefs.kgStep)||1); return v>0 ? v : 1; };
const snap = (w, st) => Math.max(0, r2(Math.round(r2(w/st))*st));
const stepUp = (w, st) => r2((Math.floor(r2(w/st))+1)*st);
const stepDown = (w, st) => Math.max(0, r2((Math.ceil(r2(w/st))-1)*st));
const pDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = s => pDate(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fmtLong = s => pDate(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year: pDate(s).getFullYear()===new Date().getFullYear()?undefined:'numeric'});
const zoneOf = s => s==null ? '' : (s < S.prefs.zoneMin ? 'under' : (s > S.prefs.zoneMax ? 'over' : 'zone'));
const entries = id => ((S.hist[id]&&S.hist[id].entries)||[]).slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'});
const sorted = () => S.machines.slice().sort(byName);
const cur = () => S.machines.find(m=>m.id===S.sel);
const mById = id => S.machines.find(m=>m.id===id);
const GREEN_AT = () => Number(S.prefs.timerGreen)||120, MAX_T = () => Number(S.prefs.timerMax)||180;
function allSets(){ const out=[]; Object.keys(S.hist).forEach(mid=>{ if(!mById(mid)) return; (S.hist[mid].entries||[]).forEach(e=>out.push({...e, mid})); }); return out.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)); }
function sessions(){ const g={}; allSets().forEach(e=>{ (g[e.date]=g[e.date]||[]).push(e); }); return Object.keys(g).sort().reverse().map(d=>({date:d, sets:g[d].slice().sort((a,b)=>byName(mById(a.mid),mById(b.mid)))})); }
/* Logo: the original ring-and-B mark, filled with a blue-to-green gradient. */
let logoN = 0;
const LOGO = cls => { const g='lg'+(++logoN); return `<svg class="${cls||'logo'}" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D5AFE"/><stop offset="1" stop-color="#2E9E62"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#${g})"/><circle cx="16" cy="16" r="15" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/><circle cx="16" cy="16" r="10.4" fill="none" stroke="#fff" stroke-width="1.1" opacity=".55"/><path fill="#fff" d="M12.2 9.4h4.6c2.5 0 4 1.2 4 3.1 0 1.2-.7 2.1-1.8 2.5 1.4.4 2.3 1.4 2.3 2.9 0 2.2-1.7 3.6-4.4 3.6h-4.7zm2.6 2.1v2.8h1.7c1 0 1.6-.5 1.6-1.4s-.6-1.4-1.6-1.4zm0 4.8v3.2h2c1.1 0 1.8-.6 1.8-1.6s-.7-1.6-1.8-1.6z"/></svg>`; };
const ICON = {
  session:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
  profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>',
  machines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M18 3v18M9 6h6v3H9zM9 11h6v3H9zM9 16h6v3H9z"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};
const PAGES = {session:'Session', machines:'Machines', history:'History', target:'Target', profile:'Profile', settings:'Settings'};

/* ---------- writes (one at a time per document) ---------- */
const chains = {};
function write(path, fn){
  chains[path] = (chains[path]||Promise.resolve()).then(fn).catch(e=>{
    console.error(e);
    showToast(e && e.code==='quota_exceeded' ? 'Storage is full. Delete old machines to free space.' : 'Could not save that change. Check your connection and try again.', true);
  });
  return chains[path];
}
function saveMachine(m){
  const {id, ...data} = m;
  const i=S.machines.findIndex(x=>x.id===id); if(i<0) S.machines.push(m); else S.machines[i]=m;
  if(S.db) return write('machines/'+id, ()=>S.db.doc('machines/'+id).set(data));
  render();
}
function saveHist(id, list){
  S.hist[id]={entries:list};
  if(S.db) return write('history/'+id, ()=>S.db.doc('history/'+id).set({entries:list}));
  render();
}
function delDoc(col,id){
  if(col==='machines') S.machines=S.machines.filter(m=>m.id!==id); else delete S.hist[id];
  if(S.db) return write(col+'/'+id, ()=>S.db.doc(col+'/'+id).delete());
  render();
}
function savePrefs(p){
  S.prefs = {...S.prefs, ...p};
  if(S.db) write('prefs/app', ()=>S.db.doc('prefs/app').set(S.prefs));
  if('unit' in p) S.drafts = {};
  render();
}
function saveProfile(p){
  S.profile = {...S.profile, ...p};
  if(S.db) write('prefs/profile', ()=>S.db.doc('prefs/profile').set(S.profile));
}
/* Next-set weight from the previous set's time, in the machine's increments:
   under 110 s down one step, 110-130 s stay, over 130 s up one step, 180 s (full time) up two steps. */
function nextStep(l, m){
  const s=l&&l.seconds; if(s==null) return 0;
  const n = s>=180 ? 2 : s>130 ? 1 : s<110 ? -1 : 0;
  return r2(n*stepFor(m));
}
function draft(m){
  if(!S.drafts[m.id]){ const l=entries(m.id)[0]; S.drafts[m.id]={weight: l?String(snap(inUnit(l)+nextStep(l,m), stepFor(m))):'', seconds:'', reps:'', date:today()}; }
  return S.drafts[m.id];
}

/* ---------- charts ---------- */
function chart(points, opt){
  const W=340,H=opt.h||160,L=34,R=8,T=10,B=22;
  if(points.length<1) return '';
  const t = p => Date.parse(p.date+'T12:00:00');
  const xs = points.map(t); let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0){x0-=86400000*3;x1+=86400000*3;}
  const vals = points.map(p=>p.v);
  const niceStep = raw => { const p=Math.pow(10,Math.floor(Math.log10(raw||1))); return [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=raw)||raw; };
  let y0=0, y1, nice;
  if(opt.ticks){ y1=Math.max(180, Math.ceil(Math.max(opt.minMax||0,...vals)/20)*20); nice=20; }
  else {
    // Fit the scale to the data (not from zero) so changes are visible.
    const lo=Math.min(...vals), hi=Math.max(...vals), pad=(hi-lo)*0.15 || Math.max(1, hi*0.05);
    nice=niceStep(((hi+pad)-(lo-pad))/4);
    y0=Math.max(0, Math.floor((lo-pad)/nice)*nice); y1=Math.ceil((hi+pad)/nice)*nice; if(y1<=y0) y1=y0+nice;
  }
  const X = v => L + (v-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">`;
  if(opt.band){ s+=`<rect x="${L}" y="${Y(opt.band[1])}" width="${W-L-R}" height="${Y(opt.band[0])-Y(opt.band[1])}" fill="var(--zone-soft)"/>`; }
  const allTicks = opt.ticks ? opt.ticks.filter(v=>v<=y1) : Array.from({length:Math.round((y1-y0)/nice)+1},(_,k)=>r1(y0+k*nice));
  // Show only major grid lines: if many ticks, show every 2nd; if very many, show every 3rd. Always show 0.
  const tickCount = allTicks.length;
  let gridStep = 1; if(!opt.ticks){ if(tickCount>8) gridStep=2; if(tickCount>12) gridStep=3; }
  const visibleTicks = allTicks.filter((v,i)=>i%gridStep===0 || v===0 || (opt.strong||[]).includes(v));
  for(const v of visibleTicks){ const strong=(opt.strong||[]).includes(v); s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${strong?'var(--muted)':'var(--line)'}" stroke-width="${strong||v===0?1.1:.6}"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end"${strong?' style="fill:var(--ink);font-weight:600"':''}>${fmt(v)}</text>`; }
  (opt.lines||[]).filter(v=>v>=y0&&v<=y1).forEach(v=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--zone)" stroke-width="1.2" stroke-dasharray="3 2"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" style="fill:var(--zone);font-weight:600">${v}</text>`; });
  // date lines: at most ~4, spaced to suit the time span (months, quarters, half-years or years)
  const spanM = (x1-x0)/(30.44*864e5);
  const stepM = [1,2,3,6,12,24,36].find(k=>spanM/k<=3) || 60;
  const d=new Date(x0); d.setDate(1); d.setHours(12,0,0,0);
  if(stepM>=12){ d.setMonth(0); d.setFullYear(d.getFullYear()+1); } else { d.setMonth(Math.floor(d.getMonth()/stepM)*stepM + stepM); }
  const multiYear = new Date(x0).getFullYear()!==new Date(x1).getFullYear();
  while(d.getTime()<=x1){
    const x=X(d.getTime()), lab = stepM>=12 ? String(d.getFullYear()) : d.toLocaleDateString('en-AU', multiYear&&d.getMonth()===0 ? {month:'short', year:'2-digit'} : {month:'short'});
    if(x>L+14 && x<W-R-14) s+=`<text x="${x}" y="${H-6}" text-anchor="middle">${lab}</text>`;
    d.setMonth(d.getMonth()+stepM);
  }
  const pts = points.map(p=>[X(t(p)),Y(p.v)]);
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.map(r1).join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{ const last=i===pts.length-1; if(!last) return; s+=`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.8"/>`; });
  return s+'</svg>';
}

/* ---------- how-to videos (Life Fitness QR links or YouTube) ---------- */
function videoId(u){
  try{ const x=new URL(String(u||'').trim()); const h=x.hostname.replace(/^www\.|^m\./,'');
    if(x.searchParams.get('url-video')) return x.searchParams.get('url-video');
    if(h==='youtu.be') return x.pathname.slice(1).split('/')[0]||null;
    if(h.endsWith('youtube.com')||h.endsWith('youtube-nocookie.com')){ if(x.searchParams.get('v')) return x.searchParams.get('v'); const mm=x.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{6,})/); return mm?mm[1]:null; }
  }catch(e){} return null;
}
function linkButtons(m, small){
  if(!m||!m.video) return '';
  const id=videoId(m.video), yt=/youtu\.?be/.test(m.video);
  const play='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
  const doc='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/></svg>';
  return `<div class="vlinks${small?' sm':''}">${yt?'':`<a class="vlink" href="${esc(m.video)}" target="_blank" rel="noopener">${doc}Instructions</a>`}${id?`<a class="vlink" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">${play}Video</a>`:''}</div>`;
}
function videoHref(m){ if(!m||!m.video) return ''; const id=videoId(m.video); return id ? 'https://www.youtube.com/watch?v='+encodeURIComponent(id) : m.video; }

/* ---------- machine icons ---------- */
const MIH=(x,y)=>`<circle cx="${x}" cy="${y}" r="2" fill="currentColor" stroke="none"/>`;
const MICONS = {
  chest:{name:'Chest press', d:`${MIH(7,5)}<path d="M4 4v11h7M7 8v6M7 10h7M14 7.5v5M17 10h4M19 8l2 2-2 2"/>`},

  shoulder:{name:'Shoulder press', d:`${MIH(12,10)}<path d="M12 12.5v6M8 18.5h8M10 13l-2-7M14 13l2-7M5 5.5h14M12 1.8v2"/><path d="M10.5 3.2L12 1.8l1.5 1.4"/>`},
  lat:{name:'Lat pulldown', d:`${MIH(12,11)}<path d="M12 13.5v5.5M8 19h8M10.2 14L7.5 6M13.8 14l2.7-8M5 5.5h14M12 5.5V1"/>`},
  row:{name:'Seated row', d:`${MIH(6,5)}<path d="M6 7.5v7.5M3 15h7M10 15l5 3M16 13v7M6.5 9.5l5 1M11.5 8.5v4M11.5 10.5H22M17 7.5l-2 1.5 2 1.5"/>`},
  pullup:{name:'Pull-up', d:`${MIH(12,8)}<path d="M4 2.5h16M9 2.5l1 6M15 2.5l-1 6M12 10.5v6M12 16.5l3 2.5M9 19.5h9"/>`},
  legpress:{name:'Leg press', d:`${MIH(5,7)}<path d="M3 10l4 8M6 10l3 6M9 16l5-5 4 2M20 7l-3 12"/>`},
  legext:{name:'Leg extension', d:`${MIH(6,4)}<path d="M3 5v9h8M6 7v7M11 14l7-4"/><circle cx="18.5" cy="9.7" r="1.4"/><path d="M15 17.5a6 6 0 0 0 5-3.5"/>`},
  legcurl:{name:'Leg curl', d:`${MIH(6,4)}<path d="M3 5v9h9M6 7v7M12 14l-1 6"/><circle cx="11" cy="20" r="1.4"/><path d="M16 13.5a5 5 0 0 1 0 6"/>`},
  calf:{name:'Calf raise', d:`${MIH(12,3)}<path d="M8.5 6h7M12 5.5v8M12 13.5l-1 5.5M12 13.5l1 5.5M7 20.5h10M19 15V9M17.5 10.5L19 9l1.5 1.5"/>`},
  abduct:{name:'Hip abduction', d:`${MIH(12,4)}<path d="M12 6.5v6M8 12.5h8M11 12.5l-4 7M13 12.5l4 7M6 14H1.5M3.5 12l-2 2 2 2M18 14h4.5M20.5 12l2 2-2 2"/>`},
  adduct:{name:'Hip adduction', d:`${MIH(12,4)}<path d="M12 6.5v6M8 12.5h8M11 12.5l-4 7M13 12.5l4 7M1 14h4.5M3.5 12l2 2-2 2M23 14h-4.5M20.5 12l-2 2 2 2"/>`},
  crunch:{name:'Ab crunch', d:`${MIH(12,7)}<path d="M8 15q0-5 3-6.5M4 15h8M12 15h4v5M14.5 6.5l1.5 4"/>`},
  backext:{name:'Back extension', d:`${MIH(5,5)}<path d="M11 15L6.5 7.5M4 15h11M15 15v5M3 9.5l3-1.5"/>`},
  curl:{name:'Biceps curl', d:`${MIH(9,4)}<path d="M9 6.5V15M9 15l-1 6M9 15l1 6M9 8.5l1 5M10 13.5l5-5M13 6.5l4 4M18 6a5 5 0 0 1 1 5"/>`},

  const addSum=(k,d,src,v)=>{ const a=(sums[k]=sums[k]||{}); const x=(a[d]=a[d]||{}); x[src]=(x[src]||0)+v; };

          .on('data',(c,meta)=>{ P.push(dec.decode(c,{stream:true})); setProgress('Reading your Health data…', meta&&meta.percent!=null?meta.percent:null); })

      }

    if(JSON.stringify(doc).length>240000){ Object.keys(doc.series).forEach(k=>doc.series[k]=doc.series[k].slice(-200)); doc.workouts=doc.workouts.slice(-200); }

    const w=out.series.weight, p={}; if(w&&w.length) p.bodyweight=String(Math.round(w[w.length-1].v)); if(out.height) p.height=String(out.height.cm);

  }catch(e){
    console.error(e);

      : e.message==='badzip' ? "That zip file looks damaged or incomplete. Export it again from the Health app and try once more."
      : e.message==='noxml' ? "That zip doesn't contain export.xml. Pick the export.zip file the Health app made."
      : e.message==='empty' ? "No usable health data was found in that file."
      : e.message==='zip' ? "Couldn't open the zip file here. Unzip it in the Files app and choose export.xml instead."
      : "Couldn't read that file. If it's very large, unzip it in the Files app and choose export.xml instead.";
  }

}

function bars(rows, opt){
  const W=340,H=150,L=34,R=8,T=10,B=22; if(!rows.length) return '';
  const max=Math.max(opt.min||0,...rows.map(r=>r.v)); const step=(()=>{ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw||1))); return [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=raw)||raw; })();
  const top=Math.ceil(max/step)*step||1, bw=(W-L-R)/rows.length;
  const Y=v=>T+(1-v/top)*(H-T-B);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">`;
  for(let v=0; v<=top+1e-9; v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v===0?1:.6}"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${v>=1000?fmt(v/1000)+'k':fmt(v)}</text>`; }
  if(opt.goal){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}" stroke="var(--zone)" stroke-dasharray="3 2"/>`; }
  rows.forEach((r,i)=>{ const x=L+i*bw+bw*0.15, h=Math.max(0,(H-B)-Y(r.v)); s+=`<rect x="${r1(x)}" y="${r1(Y(r.v))}" width="${r1(bw*0.7)}" height="${r1(h)}" rx="1.5" fill="${i===rows.length-1?'var(--accent)':'var(--accent-soft)'}" stroke="var(--accent)" stroke-width=".6"/>`; });
  const first=rows[0].d, last=rows[rows.length-1].d;
  s+=`<text x="${L}" y="${H-6}">${fmtDate(first)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(last)}</text>`;
  return s+'</svg>';
}

function shrinkImage(file){

    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ try{ const max=1200, sc=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>res(b||file),'image/jpeg',0.82); }catch(e){ res(file); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

const IS_CLAUDE = !!(window.claude && window.claude.use);
const BLOBURL = {};
function photoSrc(id){ return BLOBURL[id] || '/_blob/'+id; }
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('bogfit',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbAll(db,store){ return new Promise((res,rej)=>{ const out={}; const r=db.transaction(store).objectStore(store).openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); }
function idbPut(db,store,key,val){ return new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite'); if(val===undefined) t.objectStore(store).delete(key); else t.objectStore(store).put(val,key); t.oncomplete=()=>res(); t.onerror=t.onabort=()=>rej(t.error||new Error('storage')); }); }
async function localStores(){
  const idb=await idbOpen(), docs=await idbAll(idb,'docs'), blobs=await idbAll(idb,'blobs');
  Object.keys(blobs).forEach(id=>{ try{ BLOBURL[id]=URL.createObjectURL(blobs[id]); }catch(e){} });
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const subs=[], clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const colSnap=col=>({docs:Object.keys(docs).filter(k=>k.split('/')[0]===col).map(k=>({id:k.slice(col.length+1), data:()=>clone(docs[k])}))});
  const docSnap=p=>({exists:p in docs, data:()=>clone(docs[p])});
  const fire=p=>subs.forEach(x=>{ if(x.path===p) x.cb(docSnap(p)); else if(x.col && x.col===p.split('/')[0]) x.cb(colSnap(x.col)); });
  const db={
    collection:col=>({onSnapshot:cb=>{ subs.push({col,cb}); setTimeout(()=>cb(colSnap(col))); return ()=>{}; }}),
    doc:p=>({
      set:async d=>{ docs[p]=clone(d); await idbPut(idb,'docs',p,docs[p]); fire(p); },
      delete:async()=>{ delete docs[p]; await idbPut(idb,'docs',p,undefined); fire(p); },
      onSnapshot:cb=>{ subs.push({path:p,cb}); setTimeout(()=>cb(docSnap(p))); return ()=>{}; }
    })
  };
  const assets={
    upload:async blob=>{ const id='p-'+rid(); await idbPut(idb,'blobs',id,blob); BLOBURL[id]=URL.createObjectURL(blob); return {id}; },
    delete:async id=>{ await idbPut(idb,'blobs',id,undefined); if(BLOBURL[id]){ URL.revokeObjectURL(BLOBURL[id]); delete BLOBURL[id]; } }
  };
  return {db, assets};
}

const b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null, u8.subarray(i,i+8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function pbkdf(pw, salt, iter){ const k=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, k, 256)); }
const getLock = () => { try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); }catch(e){ return null; } };
async function setLock(pw){ const salt=crypto.getRandomValues(new Uint8Array(16)), iter=210000; const h=await pbkdf(pw,salt,iter); localStorage.setItem(LOCK_KEY, JSON.stringify({salt:b64(salt), iter, hash:b64(h)})); }
async function checkLock(pw){ const L=getLock(); if(!L) return false; return b64(await pbkdf(pw, unb64(L.salt), L.iter))===L.hash; }
async function openSeed(pw){
  let r; try{ r=await fetch(SEED_URL, {cache:'no-store'}); }catch(e){ r=null; }
  if(!r||!r.ok) throw Object.assign(new Error('seed'), {code:'noseed'});
  const sd=await r.json(), bits=await pbkdf(pw, unb64(sd.salt), sd.iter);
  const key=await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  let plain; try{ plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(sd.iv)}, key, unb64(sd.data)); }catch(e){ throw Object.assign(new Error('pw'), {code:'badpw'}); }
  return JSON.parse(new TextDecoder().decode(plain));
}
let dbReadyFn; const dbReady = new Promise(r=>dbReadyFn=r);
function unlockNow(){ S.locked=false; S.lockMsg=''; S.faceAuto=false; const m=$('#main'); delete m.dataset.lock; pickSel(); render(); window.scrollTo({top:0}); }
async function tryUnlock(pw){
  if(S.lockBusy) return;
  if(!pw){ S.lockMsg='Enter your password.'; render(); return; }
  S.lockBusy=true; S.lockMsg=''; render();
  try{
    if(getLock()){
      if(await checkLock(pw)){ S.lockBusy=false; unlockNow(); return; }
      S.lockMsg='That password isn’t right.';
    } else {
      await dbReady;
      const data=await openSeed(pw);
      if(!S.machines.length && !setCount(S.hist)){ S.restore=data; await doRestore(); S.bkMsg=''; }
      await setLock(pw); S.lockBusy=false; unlockNow(); return;
    }
  }catch(e){ console.error(e); S.lockMsg = e.code==='badpw' ? 'That password isn’t right.' : e.code==='noseed' ? "Couldn't reach your history. Check you're online and try again." : 'Something went wrong. Try again.'; }
  S.lockBusy=false; render();
}

async function changePw(){
  const cur=$('#pw-cur').value, nw=$('#pw-new').value, cf=$('#pw-cf').value;

/* Face ID: a passkey on this phone (WebAuthn platform authenticator) unlocks the app; the password stays as the fallback. */
const FACE_KEY='bogfit-faceid';
const getFace = () => { try{ return localStorage.getItem(FACE_KEY); }catch(e){ return null; } };
(async()=>{ try{ S.faceOK = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ S.faceOK=false; } if(S.faceOK) render(); })();
async function enableFace(){
  S.pwMsg=''; S.pwOk=false;
  try{
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:'BogFit', id:location.hostname}, user:{id:crypto.getRandomValues(new Uint8Array(16)), name:'BogFit', displayName:'BogFit'},
      challenge:crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred'}, timeout:60000, attestation:'none'}});
    localStorage.setItem(FACE_KEY, b64(new Uint8Array(cred.rawId)));
    try{ localStorage.setItem(FACE_KEY+'-asked','1'); }catch(e){}
    S.pwMsg='Face ID is on. BogFit will use it to unlock.'; S.pwOk=true;
  }catch(e){ console.error(e); S.pwMsg = e&&e.name==='NotAllowedError' ? 'Face ID wasn’t turned on.' : 'Face ID isn’t available here.'; }
  render();
}
function disableFace(){ try{ localStorage.removeItem(FACE_KEY); }catch(e){} S.pwMsg='Face ID is off. BogFit will ask for your password.'; S.pwOk=true; render(); }
async function faceUnlock(auto){
  const id=getFace(); if(!id || S.faceBusy) return;
  S.faceBusy=true; S.lockMsg=''; render();
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname,
      allowCredentials:[{type:'public-key', id:unb64(id)}], userVerification:'required', timeout:60000}});
    S.faceBusy=false; unlockNow(); return;
  }catch(e){ console.error(e); if(!auto) S.lockMsg='Face ID didn’t work. Try again or use your password.'; }
  S.faceBusy=false; render();
}
function faceNudge(){
  if(IS_CLAUDE || !S.faceOK || getFace() || !getLock()) return '';

}

/* ---------- render ---------- */
function render(){
  if(S.locked){
    $('#top').hidden=true; $('#tabs').hidden=true; $('#sheetRoot').innerHTML=''; $('#timerRoot').innerHTML='';
    const m=$('#main'), key=JSON.stringify([!!getLock(), !!S.lockBusy, S.lockMsg||'', !!getFace(), !!S.faceBusy]);
    if(m.dataset.lock!==key){ m.innerHTML=lockPage(); m.dataset.lock=key; const i=$('#lock-pw'); if(i&&!S.lockBusy&&!getFace()) setTimeout(()=>{ try{ i.focus(); }catch(e){} }, 50); }
    if(getFace() && getLock() && !S.faceAuto){ S.faceAuto=true; setTimeout(()=>faceUnlock(true), 300); }
    return;
  }
  const a=document.activeElement, aid=a&&a.id, sel=(a&&'selectionStart' in a)?[a.selectionStart,a.selectionEnd]:null;
  const aval = a && (a.dataset.prof||a.dataset.pref||a.dataset.set!=null||a.id==='m-notes') ? a.value : null;
  renderChrome(); renderMain(); renderSheet();
  if(aid){ const el=document.getElementById(aid); if(el && el!==document.activeElement){ try{ if(aval!=null) el.value=aval; el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
}

/* ---------- target ---------- */
function recentMuscles(days){ const d=new Date(); d.setDate(d.getDate()-days+1); const from=iso(d); const set=new Set(); allSets().filter(e=>e.date>=from).forEach(e=>normT(mById(e.mid)).forEach(t=>set.add(t))); return [...set]; }
function lastTrained(mid){ const all=allSets().filter(e=>normT(mById(e.mid)).includes(mid)); return all[0]?all[0].date:null; }
function pageTarget(){
  const recent = recentMuscles(7);
  const mKeys = () => Object.keys(MUSCLES).sort((a,b)=>MUSCLES[a].name.localeCompare(MUSCLES[b].name));
  const due = mKeys().filter(k=>!recent.includes(k) && bestFor(k).length);

/* ---------- saving a set ---------- */
function saveSet(m){
  const d=draft(m), w=r2(parseFloat(String(d.weight).replace(',','.'))), s=d.seconds===''?null:parseInt(d.seconds,10), r=d.reps===''?null:parseInt(d.reps,10);
  if(isNaN(w) || w<0){ render(); showToast('Enter the weight you used, then tap Save set.', true); const i=$('#d-weight'); i&&i.focus(); return null; }
  if(s==null && r==null){ showToast('Enter the seconds (or reps) for this set.', true); $('#d-seconds').focus(); return null; }
  const e={id:'e-'+rid(), date:d.date||today(), weight:w, unit:unit(), seconds:isNaN(s)?null:s, reps:isNaN(r)?null:r, ts:Date.now()};
  const list=(S.hist[m.id]&&S.hist[m.id].entries||[]).slice(); list.push(e);
  delete S.drafts[m.id]; S.justSaved={mid:m.id, eid:e.id}; saveHist(m.id, list);
  render(); showToast('Saved: '+w+' '+uLabel(unit())+(e.seconds!=null?' · '+e.seconds+' s':'')+(e.reps!=null?' · '+e.reps+' reps':''));
  return e;
}

/* ---------- timer ---------- */
let wake=null;
function startTimer(){
  const m=cur(); if(!m) return;
  S.timer={start:performance.now()};
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{}); }catch(e){}
  const g=GREEN_AT(), mx=MAX_T(), mm=s=>String(s);
  const d=draft(m), last=entries(m.id)[0], u=unit();
  const w = d.weight!=='' ? r2(parseFloat(String(d.weight).replace(',','.'))) : (last ? inUnit(last) : null);
  const sets=(m.settings||[]).filter(x=>(x.label||'').trim()||(x.value||'').trim());
  const note=(m.notes||'').trim();
  const info = `<div class="tinfo">
      <div class="tw"><b>${w!=null&&!isNaN(w)?w:'—'}<small>${uLabel(u)}</small></b>${last?`<span class="tl">Last time ${fmtDate(last.date)}<br>${inUnit(last)} ${uLabel(u)}${last.seconds!=null?' · '+last.seconds+' s':(last.reps?' · '+last.reps+' reps':'')}</span>`:''}</div>
      ${sets.length?`<div class="tset">${sets.map(x=>`<div><span>${esc(x.label||'Setting')}</span><strong>${esc(x.value||'—')}</strong></div>`).join('')}</div>`:''}
      ${note?`<div class="tnote">${esc(note.length>140?note.slice(0,140)+'…':note)}</div>`:''}
    </div>`;
  $('#timerRoot').innerHTML = `<div class="timer" id="tm" role="dialog" aria-label="Set timer"><div class="mname">${esc(m.name)}</div>${info}<div class="clock" id="tm-c" aria-live="off"></div><div class="phase" style="margin-top:-14px">seconds</div>
    <div class="tline"><div class="mark" style="left:${g/mx*100}%"></div><div class="fill" id="tm-f"></div></div>
    <div class="tscale"><span style="left:0">0</span><span style="left:${g/mx*100}%">${mm(g)}</span><span style="left:100%">${mm(mx)}</span></div>
    <div class="tact"><button class="cancel" data-act="timer-cancel">Cancel</button><button class="stop" data-act="timer-stop">Stop</button></div></div>`;
  tick();
}
function tick(){
  const t=S.timer; if(!t) return;
  const mx=MAX_T(), s=Math.min(mx, Math.floor((performance.now()-t.start)/1000)), tm=$('#tm');
  $('#tm-c').textContent=String(s); $('#tm-f').style.width=(s/mx*100)+'%';
  tm.className='timer '+(s<GREEN_AT()?'red':'green');
  if(s>=mx){ endTimer(true); return; }
  t.raf=requestAnimationFrame(tick);
}
function endTimer(keep){
  const t=S.timer; if(!t) return; cancelAnimationFrame(t.raf);
  const s=Math.min(MAX_T(),Math.max(0,Math.floor((performance.now()-t.start)/1000)));
  S.timer=null; $('#timerRoot').innerHTML=''; try{ wake && wake.release(); }catch(e){} wake=null;
  if(keep){ const m=cur(); if(m){ draft(m).seconds=String(s);
    if(s<5){ render(); showToast('Under 5 seconds, so not saved. Tap Save set to keep it.', true); }
    else saveSet(m); } }
}

/* ---------- events ---------- */
function selectMachine(id){ S.sel=id; try{localStorage.setItem('tul-sel',id)}catch(e){} }
document.addEventListener('click', ev=>{
  const b=ev.target.closest('[data-go],[data-sel],[data-start],[data-hv],[data-mt],[data-mi],[data-inc],[data-act],[data-unit],[data-muscle]'); if(!b) return;
  if(b.dataset.inc){ const f=$('#f-inc'); if(f) f.value=b.dataset.inc; b.parentNode.querySelectorAll('[data-inc]').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; }
  if(b.dataset.mi){ S.sheet.icon=b.dataset.mi; b.parentNode.querySelectorAll('[data-mi]').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; }
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.start){ selectMachine(b.dataset.start); go('session'); return; }
  if(b.dataset.hv){ S.histView=b.dataset.hv; renderStrip.done=false; render(); return; }
  if(b.dataset.mt){ const k=b.dataset.mt, t=S.sheet.targets, i=t.indexOf(k); if(i>=0) t.splice(i,1); else t.push(k); b.setAttribute('aria-pressed', i<0); return; }
  if(b.dataset.muscle){ S.muscle = S.muscle===b.dataset.muscle ? null : b.dataset.muscle; render(); if(S.page==='target'&&S.muscle){ const c=$('#mu'); c&&c.scrollIntoView({block:'start'}); window.scrollBy(0,-110); } return; }
  if(b.dataset.unit){ if(b.dataset.unit!==unit()) savePrefs({unit:b.dataset.unit}); return; }
  if(b.dataset.sel){ selectMachine(b.dataset.sel); S.toast=''; S.photoMsg=''; S.photoConfirm=null; render(); window.scrollTo({top:0}); return; }
  const act=b.dataset.act, m=cur();
  switch(act){
    case 'scrim': if(ev.target===b) closeSheet(); break;
    case 'close': closeSheet(); break;
    case 'add-machine': openSheet({type:'machine'}); break;
    case 'edit-machine': openSheet({type:'machine', id:b.dataset.mid||S.sel}); break;
    case 'confirm': S.sheet.confirm=true; resheet(); break;
    case 'unconfirm': S.sheet.confirm=false; resheet(); break;
    case 'save-machine': {
      const name=$('#f-name').value.trim(); if(!name){ $('#f-err').textContent='Give the machine a name.'; $('#f-name').focus(); return; }
      const incRaw=($('#f-inc')&&$('#f-inc').value||'').trim().replace(',','.'), incV=incRaw===''?null:r2(parseFloat(incRaw));
      if(incRaw!=='' && !(incV>0 && incV<=200)){ $('#f-err').textContent='Enter an increment above 0, like 1, 2.5 or 5.'; $('#f-inc').focus(); return; }
      const base = S.sheet.id ? {...mById(S.sheet.id)} : {id:'m-'+rid(), settings:[], notes:'', order:(Math.max(-1,...S.machines.map(x=>x.order??0))+1)};
      base.name=name; delete base.code; if(S.sheet.icon) base.icon=S.sheet.icon; else if(!base.icon) base.icon=guessIcon(name);
      if(S.sheet.lc) base.laneCove=true; else delete base.laneCove;
      { const v=($('#f-video')&&$('#f-video').value||'').trim(); if(v && !/^https?:\/\//i.test(v)){ $('#f-err').textContent='That video link doesn’t look right. It should start with https://'; return; } if(v) base.video=v; else delete base.video; } base.targets=S.sheet.targets.slice(); base.muscle=base.targets.map(t=>MUSCLES[t].name).slice(0,2).join(', ');
      const key=unit()==='lb'?'incLb':'incKg'; if(incV>0){ base[key]=incV; if(S.sheet.id) delete S.drafts[base.id]; }
      const isNew=!S.sheet.id, pend=S.sheet.pendingBlob; closeSheet(); if(isNew){ selectMachine(base.id); renderStrip.done=false; } delete S.drafts[base.id]; saveMachine(base); render();
      if(isNew && pend && ASSETS){ ASSETS.upload(pend, pend.type?undefined:{type:'image/jpeg'}).then(r=>{ const mm=mById(base.id); if(mm) saveMachine({...mm, photo:r.id}); render(); }).catch(e=>{ console.error(e); showToast("Couldn't save the photo. Add it again from Edit machine.", true); }); }
      break; }
    case 'move': {
      const ms=sorted(), i=ms.findIndex(x=>x.id===S.sheet.id), j=i+Number(b.dataset.dir); if(j<0||j>=ms.length) return;
      ms.splice(j,0,ms.splice(i,1)[0]);
      ms.forEach((x,k)=>{ if(x.order!==k) saveMachine({...x,order:k}); });
      resheet(); render(); break; }
    case 'del-machine': {
      const id=S.sheet.id; closeSheet(); const ms=sorted(); const i=ms.findIndex(x=>x.id===id); const next=ms[i+1]||ms[i-1];
      if(S.sel===id) S.sel = next?next.id:null; delDoc('machines',id); delDoc('history',id); render(); break; }
    case 'inc': case 'dec': {
      if(S.justSaved && S.justSaved.mid===m.id){ S.justSaved=null; const bb=document.querySelector('[data-act="edit-entry"].alt'); if(bb) bb.outerHTML='<button class="primary" data-act="save-set">Save set</button>'; }
      const d=draft(m), st=stepFor(m), w=parseFloat(d.weight)||0; d.weight=String(act==='inc' ? stepUp(w,st) : stepDown(w,st)); $('#d-weight').value=d.weight; break; }
    case 'timer': startTimer(); break;
    case 'timer-stop': endTimer(true); break;
    case 'timer-cancel': endTimer(false); break;
    case 'save-set': saveSet(m); break;
    case 'edit-entry': openSheet({type:'entry', mid:b.dataset.mid, eid:b.dataset.eid}); break;
    case 'save-entry': case 'del-entry': {
      const mid=S.sheet.mid; let list=(S.hist[mid]&&S.hist[mid].entries||[]).slice(); const i=list.findIndex(x=>x.id===S.sheet.eid); if(i<0){ closeSheet(); return; }
      if(act==='del-entry') list.splice(i,1);
      else { const w=r2(parseFloat($('#e-weight').value.replace(',','.'))), s=$('#e-seconds').value.trim(), r=$('#e-reps').value.trim();
        if(isNaN(w)){ $('#e-weight').focus(); return; }
        list[i]={...list[i], weight:w, unit:$('#e-unit').value, seconds:s===''?null:parseInt(s,10), reps:r===''?null:parseInt(r,10), date:$('#e-date').value||list[i].date}; }
      closeSheet(); delete S.drafts[mid]; saveHist(mid,list); render(); break; }
    case 'backup': if(S.page!=='settings' && !S.bkBusy){ S.bkMsg=''; } doBackup(); break;
    case 'restore-yes': doRestore(); break;
    case 'restore-no': S.restore=null; render(); break;
    case 'lock-now': S.locked=true; S.faceAuto=true; render(); break;
    case 'face-unlock': faceUnlock(false); break;
    case 'face-on': enableFace(); break;
    case 'face-off': disableFace(); break;
    case 'face-skip': try{ localStorage.setItem(FACE_KEY+'-asked','1'); }catch(e){} render(); break;
    case 'photo-ask': S.photoConfirm=m.id; render(); break;
    case 'toggle-lc': { S.sheet.lc=!S.sheet.lc; b.setAttribute('aria-pressed', S.sheet.lc); const sm=b.querySelector('small'); if(sm) sm.textContent=S.sheet.lc?'Starred: shows a gold star next to its name':'Tap to star it as a Lane Cove machine'; break; }
    case 'sheet-photo-del': { const sh=S.sheet;
      if(sh.id){ const mm=mById(sh.id); if(mm&&mm.photo){ const id=mm.photo, y={...mm}; delete y.photo; saveMachine(y); if(ASSETS) ASSETS.delete(id).catch(()=>{}); } }
      else { if(sh.pendingUrl) URL.revokeObjectURL(sh.pendingUrl); sh.pendingBlob=null; sh.pendingUrl=''; }
      resheet(); break; }
    case 'photo-del': { const id=m.photo; S.photoConfirm=null; const y={...m}; delete y.photo; saveMachine(y); if(ASSETS&&id) ASSETS.delete(id).catch(()=>{}); render(); break; }
    case 'add-setting': {
      const y={...m, settings:[...(m.settings||[]), {label:'',value:''}]}; saveMachine(y); render();
      const el=document.getElementById('s-l-'+(y.settings.length-1)); if(el) el.focus(); break; }
    case 'del-setting': {
      const st=(m.settings||[]).slice(); st.splice(Number(b.dataset.i),1); saveMachine({...m, settings:st}); render(); break; }
  }
});
document.addEventListener('submit', ev=>{
  if(ev.target.id==='lock-form'){ ev.preventDefault(); tryUnlock($('#lock-pw').value); }
  else if(ev.target.id==='pw-form'){ ev.preventDefault(); changePw(); }
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='f-inc'){ const v=parseFloat(ev.target.value.replace(',','.')); document.querySelectorAll('[data-inc]').forEach(x=>x.setAttribute('aria-pressed', Number(x.dataset.inc)===v)); return; }
  const t=ev.target, m=cur(); if(!m) return;
  const d=S.drafts[m.id]; if(!d) return;
  if(/^d-(weight|seconds|reps|date)$/.test(t.id) && S.justSaved && S.justSaved.mid===m.id){ S.justSaved=null; const b=document.querySelector('[data-act="edit-entry"].alt'); if(b){ b.outerHTML='<button class="primary" data-act="save-set">Save set</button>'; } }
  if(t.id==='d-weight') d.weight=t.value; else if(t.id==='d-seconds') d.seconds=t.value; else if(t.id==='d-reps') d.reps=t.value; else if(t.id==='d-date') d.date=t.value;
});
document.addEventListener('change', ev=>{
  const t=ev.target, m=cur();
  if(t.id==='ph-file'){ addPhoto(t.files&&t.files[0]); t.value=''; return; }
  if(t.id==='f-photo'){ const f=t.files&&t.files[0]; t.value=''; if(!f||!S.sheet) return; const sh=S.sheet;
    if(sh.id){ addPhoto(f, sh.id).then(()=>{ if(S.sheet===sh) resheet(); }); resheet(); }
    else { S.photoBusy=true; resheet(); shrinkImage(f).then(b=>{ if(sh.pendingUrl) URL.revokeObjectURL(sh.pendingUrl); sh.pendingBlob=b; sh.pendingUrl=URL.createObjectURL(b); S.photoBusy=false; if(S.sheet===sh) resheet(); }); }
    return; }
  if(t.id==='h-file'){ importHealth(t.files&&t.files[0]); t.value=''; return; }
  if(t.id==='rs-file'){ pickRestore(t.files&&t.files[0]); t.value=''; return; }
  if(t.dataset.prof){ saveProfile({[t.dataset.prof]: t.value.trim()}); return; }
  if(t.dataset.pref){ const raw=parseFloat(String(t.value).replace(',','.')); const v=/Step$/.test(t.dataset.pref) ? r2(raw) : Math.round(raw); if(!(v>0)){ render(); return; } savePrefs({[t.dataset.pref]: v}); return; }
  if(!m) return;
  if(t.dataset.set!=null){ const st=(m.settings||[]).map(x=>({...x})); const i=Number(t.dataset.set); if(!st[i]) return; st[i][t.dataset.k]=t.value.trim(); saveMachine({...m,settings:st}); }
  else if(t.id==='m-notes'){ saveMachine({...m,notes:t.value}); }
});
document.addEventListener('keydown', ev=>{ const g=ev.target.closest&&ev.target.closest('g[data-muscle]'); if(g&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; } if(ev.key==='Escape'){ if(S.timer) endTimer(false); else if(S.sheet) closeSheet(); } });

/* ---------- boot ---------- */
$('#logoSlot').innerHTML=LOGO('logo');
try{ S.sel=localStorage.getItem('tul-sel'); }catch(e){}
function pickSel(){ if(!S.machines.find(m=>m.id===S.sel)){ const f=sorted()[0]; S.sel=f?f.id:null; } }
function goLocal(){ S.mode='local'; pickSel(); render(); dbReadyFn(); }
render();
const boot = IS_CLAUDE ? window.claude.use('db') : (window.indexedDB ? localStores().then(L=>{ ASSETS=L.assets; return L.db; }) : Promise.resolve(null));
if(IS_CLAUDE) window.claude.use('assets').then(a=>{ ASSETS=a; if(S.page==='session') render(); }).catch(()=>{});
/* Home Screen app: work offline, and pick up the newest version when reopened. */
if(!IS_CLAUDE && 'serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let hiddenAt=0;
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ hiddenAt=Date.now(); return; }
    if(hiddenAt && Date.now()-hiddenAt > 10*60*1000 && !S.timer && !S.locked){ S.locked=true; S.faceAuto=false; render(); }
    if(hiddenAt && Date.now()-hiddenAt > 60*60*1000 && !S.timer && !S.sheet && !S.bkBusy && !S.healthBusy && navigator.onLine) location.reload();
  });
}
const fallback = setTimeout(()=>{ if(S.mode==='loading') goLocal(); }, 12000);
boot.then(db=>{
  if(!db){ clearTimeout(fallback); goLocal(); return; }
  S.db=db; let got={m:false,h:false};
  const ready=()=>{ if(got.m&&got.h&&S.mode==='loading'){ clearTimeout(fallback); S.mode='db'; dbReadyFn(); } if(S.mode!=='loading'){ pickSel(); migrateInc75(); migrateAddOct26(); render(); } };
  const onErr=e=>{ console.error(e); if(S.mode==='loading'){ clearTimeout(fallback); S.db=null; goLocal(); } };
  db.collection('machines').onSnapshot(snap=>{ S.machines=snap.docs.map(d=>({id:d.id,...d.data()})); got.m=true; ready(); }, onErr);
  db.collection('history').onSnapshot(snap=>{ const h={}; snap.docs.forEach(d=>h[d.id]={...d.data()}); S.hist=h; got.h=true; ready(); }, onErr);
  db.doc('prefs/app').onSnapshot(snap=>{ if(snap.exists){ const p=snap.data(); const changed=p.unit!==S.prefs.unit; S.prefs={...S.prefs,...p}; if(changed) S.drafts={}; } ready(); }, onErr);
  db.doc('health/summary').onSnapshot(snap=>{ if(snap.exists) S.health=snap.data(); ready(); }, onErr);
  db.doc('prefs/profile').onSnapshot(snap=>{ if(snap.exists){ S.profile={...S.profile,...snap.data()}; } ready(); }, onErr);
}).catch(()=>{ clearTimeout(fallback); goLocal(); });
})();
</script>
